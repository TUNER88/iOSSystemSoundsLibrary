name: Data

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate data/sounds.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet jsonschema==4.26.0
          .venv/bin/python scripts/validate_data.py

      - name: Check generated README sections are up to date
        run: python3 scripts/generate_readme.py --check
